services:
  # The only host-published service. Keep it loopback-bound unless a TLS
  # reverse proxy/CDN is the public entry point and has been configured.
  web:
    build:
      context: .
      target: web
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    ports: ['${WEB_BIND_ADDRESS:-127.0.0.1}:${WEB_PORT:-8080}:8080']
    depends_on:
      api:
        condition: service_healthy
    networks: [edge, api]
    security_opt: ['no-new-privileges:true']

  # No host port: Fastify is reachable only through nginx on the private network.
  api:
    build:
      context: .
      target: api
      args:
        APP_VERSION: ${APP_VERSION:-0.1.0}
    environment:
      PORT: 3001
      API_BIND_ADDRESS: 0.0.0.0
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      # This range is trusted only because the API has no host-published port
      # and this network contains the nginx service. Override for another proxy.
      TRUST_PROXY_CIDRS: ${TRUST_PROXY_CIDRS:-uniquelocal}
      DATABASE_URL: ${DATABASE_URL:-}
    expose: ['3001']
    networks: [api]
    volumes: ['./data/runtime/tiles:/app/data/runtime/tiles:ro']
    read_only: true
    tmpfs: ['/tmp:rw,noexec,nosuid,size=64m']
    cap_drop: ['ALL']
    security_opt: ['no-new-privileges:true']

  # Optional operator-managed services stay private. They are not public
  # endpoints and are not required by the default Townscape deployment.
  tiles:
    image: maptiler/tileserver-gl:latest
    profiles: ['tiles']
    volumes: ['./data/runtime/tiles:/data:ro']
    expose: ['8080']
    networks: [api]
    security_opt: ['no-new-privileges:true']
  geocoder:
    image: ghcr.io/komoot/photon:latest
    profiles: ['geocoder']
    volumes: ['./data/runtime/photon:/photon/photon_data:ro']
    expose: ['2322']
    networks: [api]
    security_opt: ['no-new-privileges:true']

networks:
  edge: {}
  # This network is private at the host perimeter because the API declares no
  # published port. It must still allow outbound DNS/HTTPS for the HES proxy.
  api: {}
