services:
  web:
    build: .
    ports: ['8080:80']
    depends_on: [api]
  api:
    image: node:22-alpine
    working_dir: /app
    command: sh -c "npm ci && npm run seed-db && npm run api"
    volumes: ['.:/app']
    environment:
      PORT: 3001
      NODE_ENV: production
      CORS_ORIGINS: ${CORS_ORIGINS:-}
      DATABASE_URL: postgres://historic:historic@postgis:5432/historic_towns
    ports: ['3001:3001']
    depends_on:
      postgis:
        condition: service_healthy
  postgis:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_DB: historic_towns
      POSTGRES_USER: historic
      POSTGRES_PASSWORD: historic
    volumes:
      [
        'postgis-data:/var/lib/postgresql/data',
        './docker/init-db.sql:/docker-entrypoint-initdb.d/10-init.sql:ro',
      ]
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U historic -d historic_towns']
      interval: 5s
      timeout: 5s
      retries: 10
  tiles:
    image: maptiler/tileserver-gl:latest
    profiles: ['tiles']
    volumes: ['./data/runtime/tiles:/data:ro']
    ports: ['8081:8080']
  geocoder:
    image: ghcr.io/komoot/photon:latest
    profiles: ['geocoder']
    volumes: ['./data/runtime/photon:/photon/photon_data']
    ports: ['2322:2322']
volumes:
  postgis-data:
