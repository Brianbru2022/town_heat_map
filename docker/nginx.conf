server {
  listen 8080;
  server_name _;
  root /usr/share/nginx/html;
  server_tokens off;

  # The production candidate deliberately permits only the configured OSM raster
  # origin. MapLibre obtains raster tiles with fetch, so connect-src must match.
  add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; form-action 'self'; frame-ancestors 'none'; object-src 'none'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob: https://tile.openstreetmap.org; connect-src 'self' https://tile.openstreetmap.org; font-src 'self' data:; worker-src 'self' blob:" always;
  add_header X-Content-Type-Options "nosniff" always;
  add_header Referrer-Policy "strict-origin-when-cross-origin" always;
  add_header Permissions-Policy "geolocation=(), camera=(), microphone=(), payment=(), usb=()" always;
  add_header X-Frame-Options "DENY" always;
  # Browsers only honour this over HTTPS. Enable the public TLS entry before
  # publishing the service, including any alternate public hostnames.
  add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_comp_level 6;
  gzip_types application/javascript application/json application/geo+json text/css text/plain;

  location = /health {
    proxy_pass http://api:3001/health;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    # This is the first trusted proxy in the default deployment. Replace any
    # client-supplied forwarding chain so Fastify cannot rate-limit a forged IP.
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  location = /api {
    return 404;
  }

  location ^~ /api/ {
    proxy_pass http://api:3001;
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $remote_addr;
    proxy_set_header X-Forwarded-Host $host;
    proxy_set_header X-Forwarded-Proto $scheme;
  }

  # Defence in depth: the final image contains only dist, but never fall back
  # to the SPA for repository, deployment or source-map paths.
  location ~* ^/(?:data|scripts|server|src|docker|schemas|node_modules)(?:/|$) {
    return 404;
  }
  location ~* (?:^|/)(?:\.env(?:[./]|$)|\.git(?:/|$)) {
    return 404;
  }
  location ~* \.(?:map|sqlite|mbtiles|log|ya?ml|toml|ini)$ {
    return 404;
  }

  location / {
    try_files $uri $uri/ /index.html;
  }
}
